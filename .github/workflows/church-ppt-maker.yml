name: 교회 PPT 메이커 - 윈도우 실행 파일 만들기

on:
  push:
    paths:
      - "church-ppt-maker/**"
      - ".github/workflows/church-ppt-maker.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: church-ppt-maker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 구성 요소 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: 테스트
        run: python -m pytest -q

      - name: 실행 파일 만들기
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ChurchPPT --collect-data pptx main.py

      - name: 실행 파일 자체 점검
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ChurchPPT.exe" -ArgumentList "--selftest", "dist\selftest.pptx" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path "dist\selftest.pptx")) { throw "selftest failed (exit $($p.ExitCode))" }
          Remove-Item "dist\selftest.pptx"

      - uses: actions/upload-artifact@v4
        with:
          name: ChurchPPT-windows
          path: church-ppt-maker/dist/ChurchPPT.exe
