name: 교회 PPT 메이커 - 윈도우 실행 파일 만들기

on:
  push:
    paths:
      - "church-ppt-maker/**"
      - ".github/workflows/church-ppt-maker.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: church-ppt-maker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 구성 요소 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: 한국어 글자 인식(OCR) 기능 설치 (무료 악보 읽기 점검용)
        shell: pwsh
        continue-on-error: true
        working-directory: .
        run: |
          Add-WindowsCapability -Online -Name "Language.OCR~~~ko-KR~0.0.1.0"
          Get-WindowsCapability -Online | Where-Object Name -like "Language.OCR*" | Format-Table Name, State

      - name: 테스트
        run: python -m pytest -q -rs

      - name: 무료 악보 읽기 점검 (파이썬)
        shell: pwsh
        run: |
          python tests/make_sample_sheet.py sample_sheet.png
          python main.py --ocrtest sample_sheet.png ocr_py.txt ko
          $code = $LASTEXITCODE
          Get-Content ocr_py.txt -Encoding utf8
          if ($code -ne 0) { throw "ocrtest failed" }

      - name: 실행 파일 만들기
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ChurchPPT --collect-data pptx --collect-submodules winrt main.py

      - name: 실행 파일 자체 점검
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ChurchPPT.exe" -ArgumentList "--selftest", "dist\selftest.pptx" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path "dist\selftest.pptx")) { throw "selftest failed (exit $($p.ExitCode))" }
          Remove-Item "dist\selftest.pptx"
          $p = Start-Process -FilePath "dist\ChurchPPT.exe" -ArgumentList "--ocrtest", "sample_sheet.png", "ocr_exe.txt", "ko" -Wait -PassThru
          Get-Content ocr_exe.txt -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "exe ocrtest failed (exit $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: ChurchPPT-windows
          path: church-ppt-maker/dist/ChurchPPT.exe
