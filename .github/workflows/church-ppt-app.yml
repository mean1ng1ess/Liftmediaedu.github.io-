name: 교회 PPT 모바일 앱 - 테스트

on:
  push:
    paths:
      - "church-ppt-app/**"
      - ".github/workflows/church-ppt-app.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 가사 나누기 / 악보 줄 재구성 테스트
        working-directory: church-ppt-app
        run: node --test tests/*.test.mjs
